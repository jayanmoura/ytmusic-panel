[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-daemon"
version = "1.2.0"
description = "D-Bus service exposing YouTube Music to the ytmusic-panel GNOME extension"
requires-python = ">=3.12"
license = {text = "GPL-2.0-or-later"}
# secretstorage lets yt-dlp decrypt Chromium-family cookies (GNOME keyring) for the browser login.
dependencies = ["ytmusicapi>=1.12", "yt-dlp[default]>=2026.10", "deno", "secretstorage"]

[project.scripts]
ytmusic-daemon = "ytmusic_daemon.service:main"
ytmusic-daemon-login = "ytmusic_daemon.login:main"

[tool.setuptools]
packages = ["ytmusic_daemon"]

[tool.setuptools.package-data]
ytmusic_daemon = ["preload.lua"]

[project.optional-dependencies]
# Development only: pip install -e "daemon[dev]" (inside the venv).
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ytmusic_daemon"]
