name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Serviço (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the minimum in pyproject.toml; 3.14 is Ubuntu 26.04's.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o serviço e as ferramentas de desenvolvimento
        run: pip install -e "daemon[dev]"
      - name: ruff
        run: ruff check --config daemon/pyproject.toml daemon scripts
      - name: pytest
        run: pytest daemon
      - name: Interface D-Bus igual nos dois lados
        run: python scripts/check-interface.py
      - name: Métodos do indicador chamados pelos módulos
        run: python scripts/check-calls.py

  extension:
    name: Extensão (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
